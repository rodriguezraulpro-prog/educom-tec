    <script>
      (function() {

          var originalFetch = window.fetch;
          var fetchHandler = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          var descriptor = {
            get: function() {
              return fetchHandler;
            },
            set: function(val) {
              fetchHandler = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (e) {
          console.warn('Fetch setter patch:', e);
        }
      })();

  <body class="bg-white dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased selection:bg-[#2563eb] selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__bootEducomFallback && window.__bootEducomFallback()"></script>
    <script>
      (function() {
        var fallbackStarted = false;

        function isViteOrBuiltEnvironment() {
          if (document.querySelector('script[src*="@vite/client"]')) return true;
          if (document.querySelector('script[src*="/_aistudio-iframe"]')) return true;
          if (document.querySelector('script[src*="assets/app"]')) return true;
          return false;
        }

        function loadScript(src) {
          return new Promise(function(resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.crossOrigin = 'anonymous';
            s.onload = resolve;
            s.onerror = function() {
              reject(new Error('No se pudo cargar el recurso CDN: ' + src));
            };
            document.head.appendChild(s);
          });
        }

        function isValidRawSources(srcMap) {
          if (!srcMap || typeof srcMap !== 'object') return false;
          var appCode = srcMap['src/App.tsx'];
          var mainCode = srcMap['src/main.tsx'];
          if (typeof appCode !== 'string' || typeof mainCode !== 'string') return false;
          if (appCode.indexOf('/node_modules/.vite/') !== -1 || mainCode.indexOf('/node_modules/.vite/') !== -1) {
            return false;
          }
          if (appCode.indexOf('__vite__cjsImport') !== -1 || mainCode.indexOf('__vite__cjsImport') !== -1) {
            return false;
          }
          return true;
        }

        function resolveNormalizedPath(fromFile, imp, availableMap) {
          if (!imp || imp.charAt(0) !== '.') return imp;
          var cleanImp = imp.replace(/\?raw$/, '');
          var dir = fromFile.substring(0, fromFile.lastIndexOf('/'));
          var parts = (dir + '/' + cleanImp).split('/');
          var stack = [];
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            if (!p || p === '.') continue;
            if (p === '..') stack.pop();
            else stack.push(p);
          }
          var normalized = stack.join('/');
          var candidates = [normalized, normalized + '.ts', normalized + '.tsx', normalized + '.json'];
          for (var j = 0; j < candidates.length; j++) {
            if (Object.prototype.hasOwnProperty.call(availableMap, candidates[j])) {
              return candidates[j];
            }
          }
          return normalized;
        }

        window.__bootEducomFallback = async function() {
          if (fallbackStarted || window.__EDUCOM_APP_BOOTED__) return;
          if (isViteOrBuiltEnvironment() && window.location.protocol !== 'file:') return;
          fallbackStarted = true;

          var rootEl = document.getElementById('root');
          var hasValidPreload = isValidRawSources(window.__PRELOADED_SOURCES__);

          // If opened via file:// from a raw folder without valid preloaded sources
          if (window.location.protocol === 'file:' && !hasValidPreload) {
            if (rootEl && !window.__EDUCOM_APP_BOOTED__) {
              rootEl.innerHTML =
                '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Plus Jakarta Sans,sans-serif;background:#0b0f19;color:#f8fafc;">' +
                '<div style="max-width:560px;background:#141824;border:1px solid #1e293b;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,0.5);">' +
                '<div style="display:inline-block;padding:6px 12px;border-radius:999px;background:#2563eb22;color:#38bdf8;font-size:12px;font-weight:700;margin-bottom:14px;">EDUCOM-TEC • MODO ARCHIVO LOCAL (file://)</div>' +
                '<h2 style="margin:0 0 12px;font-size:22px;font-weight:800;">Usa el archivo descargado desde el Panel Admin</h2>' +
                '<p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 16px;">Los navegadores bloquean por seguridad (CORS) la lectura de múltiples archivos <code>.tsx</code> sueltos cuando se abre la carpeta del código con doble clic (<code>file://</code>).</p>' +
                '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;font-size:13px;line-height:1.6;color:#cbd5e1;">' +
                '<strong style="color:#fff;display:block;margin-bottom:6px;">✅ Cómo obtener el index.html auto-contenido:</strong>' +
                '1. En AI Studio (o en tu web publicada), abre el <strong>Panel Admin</strong>.<br>' +
                '2. Haz clic en el botón azul <strong>"Descargar Web (Cloudflare / PC)"</strong> arriba a la derecha.<br>' +
                '3. Ese archivo <code>index.html</code> único ya incluye todo el código empaquetado: puedes abrirlo con doble clic en tu PC o subirlo a Cloudflare Pages / GitHub Pages.' +
                '</div>' +
                '</div></div>';
            }
            return;
          }

          var modulesOrder = [
            'src/types.ts',
            'src/data/portfolioData.ts',
            'src/lib/firebase.ts',
            'src/lib/firestoreService.ts',
            'src/utils/exportStandaloneHtml.ts',
            'src/components/ConstellationBackground.tsx',
            'src/components/DigitalSignature.tsx',
            'src/components/FloatingWhatsApp.tsx',
            'src/components/Navbar.tsx',
            'src/components/Hero.tsx',
            'src/components/ProductShowcase.tsx',
            'src/components/AboutSection.tsx',
            'src/components/ContactSection.tsx',
            'src/components/Footer.tsx',
            'src/components/ProductDetailModal.tsx',
            'src/components/AddProductModal.tsx',
            'src/components/AdminLoginModal.tsx',
            'src/components/AdminPanelModal.tsx',
            'src/App.tsx',
            'src/main.tsx'
          ];

          var allFiles = ['firebase-applet-config.json', 'src/index.css'].concat(modulesOrder);
          var sources = {};

          try {
            if (hasValidPreload) {
              sources = window.__PRELOADED_SOURCES__;
            } else {
              // Probe src/main.tsx first: if Vite Dev Server transformed it, abort fallback immediately and let Vite run natively
              var probeRes = await fetch('./src/main.tsx');
              if (!probeRes.ok) throw new Error('No se pudo cargar ./src/main.tsx (HTTP ' + probeRes.status + ')');
              var probeText = await probeRes.text();
              if (probeText.indexOf('/node_modules/.vite/') !== -1 || probeText.indexOf('__vite__cjsImport') !== -1 || probeText.indexOf('/@vite/client') !== -1) {
                return;
              }
              sources['src/main.tsx'] = probeText;

              await Promise.all(
                allFiles.map(async function(f) {
                  if (f === 'src/main.tsx') return;
                  var res = await fetch('./' + f);
                  if (!res.ok) throw new Error('No se pudo cargar ./' + f + ' (HTTP ' + res.status + ')');
                  sources[f] = await res.text();
                })
              );
              try {
                var idxRes = await fetch('./index.html');
                if (idxRes.ok) sources['index.html'] = await idxRes.text();
              } catch (_) {}
            }

            if (window.__EDUCOM_APP_BOOTED__) return;
            window.__RUNTIME_SOURCES__ = sources;

            if (rootEl && !window.__EDUCOM_APP_BOOTED__ && !rootEl.innerHTML.trim()) {
              rootEl.innerHTML =
                '<div id="educom-boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,sans-serif;background:#ffffff;color:#0f172a;">' +
                '<div style="width:44px;height:44px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:educomSpin 0.8s linear infinite;margin-bottom:16px;"></div>' +
                '<div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">Educom-Tec</div>' +
                '<div style="font-size:12px;color:#64748b;margin-top:4px;">Iniciando plataforma...</div>' +
                '<style>@keyframes educomSpin{to{transform:rotate(360deg)}}</style>' +
                '</div>';
            }

            // 1. Inject Tailwind v4 CSS rules + custom index.css
            var styleEl = document.createElement('style');
            styleEl.setAttribute('type', 'text/tailwindcss');
            var rawCss = sources['src/index.css'] || '';
            if (rawCss.indexOf('/@vite/client') !== -1) {
              rawCss = '@import "tailwindcss";\n@custom-variant dark (&:where(.dark, .dark *));\n';
            } else if (rawCss.indexOf('@custom-variant dark') === -1) {
              rawCss = '@import "tailwindcss";\n@custom-variant dark (&:where(.dark, .dark *));\n' + rawCss.replace('@import "tailwindcss";', '');
            }
            styleEl.textContent = rawCss;
            document.head.appendChild(styleEl);

            // 2. Load Tailwind v4 Browser Runtime & Babel Standalone in parallel
            await Promise.all([
              loadScript('https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'),
              loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js')
            ]);

            if (window.__EDUCOM_APP_BOOTED__) return;

            // 3. Compile all modules into CommonJS factories (no blob: URLs, no importmap required)
            var cjsDefs = {};
            var configJsonStr = sources['firebase-applet-config.json'] || '{}';
            var configObj = {};
            try {
              configObj = JSON.parse(configJsonStr);
            } catch (_) {}
            cjsDefs['firebase-applet-config.json'] = function(module) {
              module.exports = configObj;
            };

            for (var k = 0; k < modulesOrder.length; k++) {
              var modPath = modulesOrder[k];
              var rawCode = (sources[modPath] || '').replace(/import\s+['"]\.\/index\.css['"];?/g, '');
              var compiled = window.Babel.transform(rawCode, {
                filename: modPath,
                compact: false,
                presets: [
                  ['env', { targets: { esmodules: true }, modules: 'commonjs' }],
                  ['react', { runtime: 'automatic' }],
                  ['typescript', { isTSX: modPath.endsWith('.tsx'), allExtensions: true }]
                ]
              }).code || '';

              cjsDefs[modPath] = new Function('module', 'exports', 'require', compiled);
            }

            window.__startEducomCommonJS = function(rawExternals) {
              if (window.__EDUCOM_APP_BOOTED__) return;
              try {
                function wrapEsm(ns) {
                  var out = Object.assign({ __esModule: true }, ns);
                  if (!out.default) out.default = (ns && ns.default) || ns;
                  return out;
                }

                var externals = {};
                for (var extName in rawExternals) {
                  externals[extName] = wrapEsm(rawExternals[extName]);
                }

                var moduleCache = {};
                function makeRequire(fromFile) {
                  return function(imp) {
                    if (externals[imp]) return externals[imp];
                    if (imp && imp.slice(-4) === '?raw') {
                      var rawKey = resolveNormalizedPath(fromFile, imp, sources);
                      var rawVal = sources[rawKey] || '';
                      return { __esModule: true, default: rawVal };
                    }
                    var resolved = resolveNormalizedPath(fromFile, imp, cjsDefs);
                    if (moduleCache[resolved]) return moduleCache[resolved].exports;
                    if (!cjsDefs[resolved]) {
                      throw new Error('Módulo no encontrado: ' + imp + ' (desde ' + fromFile + ' -> ' + resolved + ')');
                    }
                    var mod = { exports: {} };
                    moduleCache[resolved] = mod;
                    cjsDefs[resolved](mod, mod.exports, makeRequire(resolved));
                    return mod.exports;
                  };
                }

                makeRequire('src/main.tsx')('./main.tsx');
              } catch (runtimeErr) {
                console.error('Error starting CommonJS bundle:', runtimeErr);
                window.__showEducomBootError(runtimeErr);
              }
            };

            window.__showEducomBootError = function(err) {
              if (rootEl && !window.__EDUCOM_APP_BOOTED__) {
                rootEl.innerHTML =
                  '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Plus Jakarta Sans,sans-serif;background:#0b0f19;color:#f8fafc;">' +
                  '<div style="max-width:600px;background:#141824;border:1px solid #ef444466;border-radius:16px;padding:24px;">' +
                  '<h3 style="margin:0 0 8px;color:#f87171;font-size:18px;">Error al iniciar la aplicación</h3>' +
                  '<pre style="white-space:pre-wrap;word-break:break-word;background:#0f172a;padding:12px;border-radius:8px;font-size:12px;color:#cbd5e1;">' +
                  String(err && (err.stack || err.message || err)) +
                  '</pre></div></div>';
              }
            };

            // 4. Inject single inline ES module with explicit HTTPS URLs (works on file://, Cloudflare Pages, and GitHub Pages)
            var bootModule = document.createElement('script');
            bootModule.type = 'module';
            bootModule.onerror = function() {
              window.__showEducomBootError('No se pudieron importar las librerías ESM desde https://esm.sh o https://www.gstatic.com. Verifica tu conexión a internet.');
            };
            bootModule.textContent = [
              'import * as ReactPkg from "https://esm.sh/react@19.0.0";',
              'import * as JsxRuntimePkg from "https://esm.sh/react@19.0.0/jsx-runtime";',
              'import * as ReactDomPkg from "https://esm.sh/react-dom@19.0.0";',
              'import * as ReactDomClientPkg from "https://esm.sh/react-dom@19.0.0/client";',
              'import * as LucidePkg from "https://esm.sh/lucide-react@0.546.0?deps=react@19.0.0";',
              'import * as FirebaseAppPkg from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";',
              'import * as FirebaseFirestorePkg from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";',
              'window.__startEducomCommonJS({',
              '  "react": ReactPkg,',
              '  "react/jsx-runtime": JsxRuntimePkg,',
              '  "react-dom": ReactDomPkg,',
              '  "react-dom/client": ReactDomClientPkg,',
              '  "lucide-react": LucidePkg,',
              '  "firebase/app": FirebaseAppPkg,',
              '  "firebase/firestore": FirebaseFirestorePkg',
              '});'
            ].join('\n');
            document.body.appendChild(bootModule);
          } catch (err) {
            console.error('Error booting portable compiler:', err);
            if (window.__showEducomBootError) {
              window.__showEducomBootError(err);
            }
          }
        };

        if (
          window.location.protocol === 'file:' ||
          (!isViteOrBuiltEnvironment() && isValidRawSources(window.__PRELOADED_SOURCES__))
        ) {
          window.__bootEducomFallback();
        }
      })();
    </script>
